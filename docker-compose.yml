services:
  pulse:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: pulse:latest
    ports:
      - "8080:8080"
    environment:
      # SQLite is the default store; the database file lives on the volume.
      # The first visit shows a setup wizard to create the admin account. It asks
      # for the setup token in the log: docker compose logs pulse | grep "setup token"
      PULSE_DB: /data/pulse.db
      # Optional notification channels. Leave unset to disable.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PULSE_EMAIL_FROM: ${PULSE_EMAIL_FROM:-}
      # Email through an SMTP relay instead of Resend (see docs/configuration.md).
      PULSE_SMTP_HOST: ${PULSE_SMTP_HOST:-}
      PULSE_SMTP_PORT: ${PULSE_SMTP_PORT:-}
      PULSE_SMTP_USER: ${PULSE_SMTP_USER:-}
      PULSE_SMTP_PASSWORD: ${PULSE_SMTP_PASSWORD:-}
      PULSE_SMTP_PASSWORD_FILE: ${PULSE_SMTP_PASSWORD_FILE:-}
      PULSE_SMTP_TLS: ${PULSE_SMTP_TLS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Mark session cookies Secure when serving over HTTPS.
      PULSE_SECURE_COOKIES: ${PULSE_SECURE_COOKIES:-false}
      # Set to "true" to let monitors target private/LAN addresses (homelab).
      PULSE_ALLOW_PRIVATE_MONITORS: ${PULSE_ALLOW_PRIVATE_MONITORS:-false}
    volumes:
      - pulse_data:/data
    restart: unless-stopped

volumes:
  pulse_data:
