site_name: Pulse Documentation
site_url: https://docs.shreeda.xyz
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Monitors: monitors.md
  - Incidents: incidents.md
  - Maintenance: maintenance.md
  - Status pages: status-pages.md
  - Theming: theming.md
  - API: api.md
  - Security: security.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Roadmap: roadmap.md

# Internal planning notes live under docs/superpowers and are not published.
exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
