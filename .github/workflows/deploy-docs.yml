name: Docs

# Builds the docs site strictly, so a broken link or nav entry fails the pull request. The
# live site, docs.shreeda.xyz, is rebuilt by the homelab itself from the head of main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mkdocs build --strict
        run: |
          docker run --rm -v "$PWD:/docs" squidfunk/mkdocs-material:9.7.7 \
            build --strict -f /docs/mkdocs.yml -d /docs/_site
