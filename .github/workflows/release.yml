name: Release

# Builds and publishes a release: the image to GHCR (ghcr.io/memetics19/pulse:X.Y.Z, X.Y and
# latest) and the binaries with SHA256SUMS on the GitHub Release. release-please calls it
# with the tag it created. A vX.Y.Z tag pushed by hand runs it too. The homelab picks the
# new image up by itself, so nothing here reaches into it.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v2.0.0
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: cd api && go vet ./...
      - run: cd api && go test ./... -count=1

  release:
    name: Build image and publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Cross-compile the single static binary (pure Go, no CGO) with the admin UI
  # embedded, for every supported OS/arch, and attach them to the GitHub release
  # so `deploy/install.sh` can download the right one. Runs in parallel with the
  # image build; both only gate on tests passing.
  binaries:
    name: Publish release binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and embed the admin UI
        run: |
          cd ui
          NEXT_PUBLIC_API_URL="" npm ci
          NEXT_PUBLIC_API_URL="" npm run build
          cd ..
          rm -rf api/internal/web/dist
          mkdir -p api/internal/web/dist
          cp -r ui/out/* api/internal/web/dist/
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Cross-compile binaries
        run: |
          mkdir -p dist-bin
          cd api
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="../dist-bin/pulse_${os}_${arch}"
            echo "==> building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/pulse
          done
      - name: Generate checksums
        run: cd dist-bin && sha256sum pulse_* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist-bin/pulse_*
            dist-bin/SHA256SUMS
