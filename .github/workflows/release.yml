name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: cd api && go vet ./...
      - run: cd api && go test ./... -count=1

  release:
    name: Build image and publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PULSE_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Cross-compile the single static binary (pure Go, no CGO) with the admin UI
  # embedded, for every supported OS/arch, and attach them to the GitHub release
  # so `deploy/install.sh` can download the right one. Runs in parallel with the
  # image build; both only gate on tests passing.
  binaries:
    name: Publish release binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and embed the admin UI
        run: |
          cd ui
          NEXT_PUBLIC_API_URL="" npm ci
          NEXT_PUBLIC_API_URL="" npm run build
          cd ..
          rm -rf api/internal/web/dist
          mkdir -p api/internal/web/dist
          cp -r ui/out/* api/internal/web/dist/
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # All three workspace binaries ship: pulse-agent runs on the hosts being
      # monitored, so publishing only the server left it reachable solely by
      # building from source.
      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          for spec in "api ./cmd/pulse pulse" \
                      "agent ./cmd/agent pulse-agent" \
                      "cli ./cmd/pulse-cli pulse-cli"; do
            set -- $spec
            module="$1"; pkg="$2"; name="$3"
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              os="${target%/*}"; arch="${target#*/}"
              out="../dist-bin/${name}_${os}_${arch}"
              echo "==> building $out"
              ( cd "$module" && GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                  go build -trimpath -ldflags "-s -w" -o "$out" "$pkg" )
            done
          done
          ls -1 dist-bin
      - name: Generate checksums
        run: cd dist-bin && sha256sum pulse_* pulse-agent_* pulse-cli_* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-bin/pulse_*
            dist-bin/pulse-agent_*
            dist-bin/pulse-cli_*
            dist-bin/SHA256SUMS

  # Deploy runs only after the image is built and pushed, so the homelab never
  # pulls a tag that does not exist yet. The GitHub release + changelog are
  # created by release-please (see release-please.yml), not here.
  deploy:
    name: Deploy to homelab
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Join Netbird VPN
        # Managed Netbird cloud — uses the default management URL, no self-hosted URL needed.
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sudo sh
          sudo netbird up --setup-key "${{ secrets.NETBIRD_SETUP_KEY }}"
          sudo netbird status
      - name: Pull and restart on host over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/pulse
            git fetch --tags && git pull --ff-only
            docker compose -f deploy/docker-compose.homelab.yml pull
            docker compose -f deploy/docker-compose.homelab.yml up -d
            docker image prune -f
