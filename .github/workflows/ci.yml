name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet, fmt, test, coverage)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Thresholds exclude generated (sqlc) code. api and agent sit at 85:
          # both have unreachable defensive branches (OS syscall / filesystem /
          # process-bootstrap error paths) that can't be exercised in tests.
          - module: api
            threshold: 85
          - module: cli
            threshold: 90
          - module: agent
            threshold: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      # The workspace has three modules; each one is vetted, tested and gated.
      - name: go vet
        run: cd ${{ matrix.module }} && go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(find ${{ matrix.module }} -name '*.go' -not -path '*/internal/generated/*'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go test (race)
        run: cd ${{ matrix.module }} && go test ./... -race -count=1
      - name: coverage gate (excluding generated)
        run: bash scripts/coverage.sh ${{ matrix.module }} ${{ matrix.threshold }}
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/coverage.html
            ${{ matrix.module }}/coverage-badge.json
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, agent, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      # golangci-lint must be built with a Go at least as new as go.mod's (1.27).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install deps
        run: cd ui && NEXT_PUBLIC_API_URL="" npm ci
      - name: lint
        run: cd ui && npm run lint
      - name: build static export
        run: cd ui && NEXT_PUBLIC_API_URL="" npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: api/Dockerfile
            tag: pulse:ci
          - file: agent/Dockerfile
            tag: pulse-agent:ci
    steps:
      - uses: actions/checkout@v4
      # Both platforms the release publishes. Go cross-compiles on the runner, so QEMU only
      # runs the small arm64 runtime stage.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ matrix.tag }}

  packages:
    name: Packages (install, upgrade, remove)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Linux binaries (the committed placeholder admin UI is enough here)
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          for spec in "api ./cmd/pulse pulse" "agent ./cmd/agent pulse-agent" "cli ./cmd/pulse-cli pulse-cli"; do
            set -- $spec
            for arch in amd64 arm64; do
              ( cd "$1" && GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o "../dist-bin/${3}_linux_$arch" "$2" )
            done
          done
      - name: Build the packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          packaging/build-packages.sh 0.0.1
      - name: Install them
        run: sudo apt-get install -y -qq ./dist-bin/pulse_0.0.1_amd64.deb ./dist-bin/pulse-agent_0.0.1_amd64.deb ./dist-bin/pulse-cli_0.0.1_amd64.deb
      - name: The service runs, as its own user, with private settings
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/healthz
          systemctl is-active pulse
          echo "runs as: $(ps -o user= -C pulse | sort -u)"
          [ "$(ps -o user= -C pulse | sort -u)" = pulse ]
          echo "settings: $(stat -c '%a %U %G' /etc/pulse/pulse.env)"
          [ "$(stat -c '%a %U %G' /etc/pulse/pulse.env)" = "640 root pulse" ]
          # The database appears at first setup: before that the data directory is empty.
          echo "data: $(stat -c '%a %U %G' /var/lib/pulse)"
          [ "$(stat -c '%a %U %G' /var/lib/pulse)" = "750 pulse pulse" ]
          test -x /usr/bin/pulse-cli
      - name: The agent waits for its settings
        run: |
          set -euo pipefail
          ! systemctl is-enabled --quiet pulse-agent
          echo "token: $(stat -c '%a %U %G' /etc/pulse-agent/token)"
          [ "$(stat -c '%a %U %G' /etc/pulse-agent/token)" = "640 root pulse-agent" ]
      - name: An upgrade keeps edited settings and restarts the service
        run: |
          set -euo pipefail
          sudo sed -i 's/^PULSE_ALLOW_PRIVATE_MONITORS=false/PULSE_ALLOW_PRIVATE_MONITORS=true/' /etc/pulse/pulse.env
          before=$(systemctl show -p MainPID --value pulse)
          rm -f dist-bin/*.deb dist-bin/*.rpm
          packaging/build-packages.sh 0.0.2
          sudo apt-get install -y -qq -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold ./dist-bin/pulse_0.0.2_amd64.deb
          sudo grep -qx 'PULSE_ALLOW_PRIVATE_MONITORS=true' /etc/pulse/pulse.env
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break; sleep 1; done
          [ "$(systemctl show -p MainPID --value pulse)" != "$before" ]
          [ "$(dpkg-query -W -f '${Version}' pulse)" = 0.0.2 ]
      - name: Removing it stops the service and keeps the data
        run: |
          set -euo pipefail
          sudo apt-get remove -y -qq pulse
          ! systemctl is-active --quiet pulse
          [ -d /var/lib/pulse ]
