name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet, fmt, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # The workspace has three modules. Checking only api left agent and cli
      # entirely unverified in CI.
      - name: go vet
        run: |
          set -euo pipefail
          for module in api agent cli; do
            echo "::group::vet $module"
            (cd "$module" && go vet ./...)
            echo "::endgroup::"
          done
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(find api agent cli -name '*.go' -not -path '*/internal/generated/*'))"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go test
        run: |
          set -euo pipefail
          for module in api agent cli; do
            echo "::group::test $module"
            (cd "$module" && go test ./... -count=1)
            echo "::endgroup::"
          done

  ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        run: cd ui && NEXT_PUBLIC_API_URL="" npm ci
      - name: lint
        run: cd ui && npm run lint
      - name: build static export
        run: cd ui && NEXT_PUBLIC_API_URL="" npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: pulse:ci
