name: PR title

# Squash merges compose the commit message on main from the PR title, and
# release-please parses that message to decide the next version. A title that
# is not a Conventional Commit is silently unparseable, so the change never
# reaches the changelog and never bumps the version. The commit-msg hook cannot
# catch this: the squash title is composed by GitHub, not locally.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Kept in sync with the commit policy in CONTRIBUTING.md.
          types: |
            feat
            fix
            refactor
            docs
            build
            ci
            test
            chore
