version: "2"
sql:
  - engine: "sqlite"
    queries: "queries/"
    # Single-digit migrations first, then two-digit ones. A plain directory is
    # read in lexical order, which puts 13_* before 2_auth (users table).
    schema:
      - "migrations/?_*.up.sql"
      - "migrations/??_*.up.sql"
    gen:
      go:
        package: "generated"
        out: "../generated"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "monitors.is_active"
            go_type: "bool"
          - column: "infra_agents.is_active"
            go_type: "bool"
